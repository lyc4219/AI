<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>光影千年——赣南皮影戏数字体验展</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            background: #000;
            overflow: hidden;
        }
        
        @media (min-width: 481px) {
            .container {
                width: 375px;
                height: 667px;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }
        }
        
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .layer {
            position: absolute;
            transform-origin: center center;
        }
        
        .shape-layer {
            pointer-events: none;
        }
        
        .text-layer {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            white-space: pre-line;
            pointer-events: none;
            line-height: 1.4;
        }
        
        .button-layer {
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            border: 2px solid rgba(255, 215, 0, 0.3);
            font-weight: bold;
            z-index: 50;
        }
        
        .button-layer:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .button-layer:active {
            transform: scale(0.97);
        }
        
        .oil-lamp {
            filter: drop-shadow(0 0 30px rgba(255, 165, 0, 0.8));
        }
        
        .glow {
            opacity: 0.7;
            mix-blend-mode: screen;
        }
        
        .paper-texture {
            background: 
                repeating-linear-gradient(
                    45deg,
                    #f5f0e6 0px,
                    #f5f0e6 2px,
                    #ebe5d8 2px,
                    #ebe5d8 4px
                ),
                linear-gradient(180deg, #faf5eb 0%, #e8e0d0 100%);
        }
        
        .timeline-node {
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 30;
        }
        
        .timeline-node:active {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(139, 69, 19, 0.6);
        }
        
        .timeline-node.active {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }
        
        .content-card {
            background: rgba(255, 248, 240, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border: 2px solid #8B4513;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 20;
        }
        
        .content-title {
            color: #8B4513;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .content-text {
            color: #333;
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
        }
        
        .nav-button {
            position: absolute;
            bottom: 30px;
            width: 100px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            z-index: 60;
        }
        
        .nav-button.prev {
            left: 20px;
            background: rgba(139, 69, 19, 0.9);
            color: #fff;
        }
        
        .nav-button.next {
            right: 20px;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            color: #8B4513;
        }
        
        .nav-button:active {
            transform: scale(0.95);
        }
        
        .page-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 100;
        }
        
        .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .indicator-dot.active {
            background: #FFD700;
            width: 16px;
            border-radius: 3px;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        @keyframes glow-pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes shadow-walk {
            0% { transform: translateX(0); }
            100% { transform: translateX(250px); }
        }
        
        @keyframes scroll-open-left {
            0% { transform: translateX(300px); }
            100% { transform: translateX(-280px); }
        }
        
        @keyframes scroll-open-right {
            0% { transform: translateX(-300px); }
            100% { transform: translateX(280px); }
        }
        
        .flicker {
            animation: flicker 0.4s infinite;
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        .glow-pulse {
            animation: glow-pulse 3s ease-in-out infinite;
        }
        
        .float {
            animation: float 2s ease-in-out infinite;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 1s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            color: #FFD700;
            font-size: 22px;
            animation: pulse 1.5s ease-in-out infinite;
            font-weight: bold;
        }
        
        .oil-lamp-icon {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .oil-lamp-body {
            width: 100%;
            height: 80%;
            position: absolute;
            bottom: 0;
            background: linear-gradient(180deg, #8B4513 0%, #654321 50%, #4a3520 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
        }
        
        .oil-lamp-flame {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse at center, #FFD700 0%, #FFA500 40%, transparent 70%);
            animation: flicker 0.3s infinite;
        }
        
        .theater-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #2d1f1f 30%, #3d2914 60%, #2d1f1f 100%);
            position: relative;
        }
        
        .theater-stage {
            position: absolute;
            top: 25%;
            left: 10%;
            right: 10%;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,245,225,0.9) 0%, rgba(255,240,210,0.95) 100%);
            border: 8px solid #8B4513;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 0 30px rgba(139, 69, 19, 0.2);
        }
        
        .theater-curtain {
            position: absolute;
            top: 15%;
            left: 5%;
            right: 5%;
            height: 15%;
            background: linear-gradient(180deg, #8B0000 0%, #650000 100%);
            border-radius: 5px 5px 0 0;
        }
        
        .theater-base {
            position: absolute;
            bottom: 10%;
            left: 5%;
            right: 5%;
            height: 20%;
            background: linear-gradient(180deg, #654321 0%, #3d2914 100%);
            border-radius: 0 0 10px 10px;
        }
        
        .shadow-figure-icon {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .shadow-body {
            position: absolute;
            width: 50%;
            height: 55%;
            top: 30%;
            left: 25%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20% 20% 10% 10%;
        }
        
        .shadow-head {
            position: absolute;
            width: 30%;
            height: 25%;
            top: 8%;
            left: 35%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 50% 50% 40% 40%;
        }
        
        .shadow-arm-left {
            position: absolute;
            width: 25%;
            height: 35%;
            top: 35%;
            left: 5%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            transform: rotate(-30deg);
            transform-origin: top center;
        }
        
        .shadow-arm-right {
            position: absolute;
            width: 25%;
            height: 35%;
            top: 35%;
            right: 5%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            transform: rotate(30deg);
            transform-origin: top center;
        }
        
        .shadow-leg-left {
            position: absolute;
            width: 20%;
            height: 35%;
            bottom: 0;
            left: 28%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 5px;
        }
        
        .shadow-leg-right {
            position: absolute;
            width: 20%;
            height: 35%;
            bottom: 0;
            right: 28%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 5px;
        }
        
        .scroll-left {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #654321 0%, #8B4513 10%, #D2B48C 15%, #DEB887 50%, #D2B48C 85%, #8B4513 90%, #654321 100%);
            border-left: 10px solid #3d2914;
            position: relative;
        }
        
        .scroll-right {
            width: 100%;
            height: 100%;
            background: linear-gradient(270deg, #654321 0%, #8B4513 10%, #D2B48C 15%, #DEB887 50%, #D2B48C 85%, #8B4513 90%, #654321 100%);
            border-right: 10px solid #3d2914;
            position: relative;
        }
        
        .timeline-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #8B4513;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .wood-bg {
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    90deg,
                    #5d4037 0px,
                    #6d4c41 2px,
                    #4e342e 4px,
                    #5d4037 8px
                ),
                linear-gradient(180deg, #5d4037 0%, #4e342e 100%);
        }
        
        .step-tab {
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .step-tab.active {
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%) !important;
            color: #8B4513 !important;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .step-tab:active {
            transform: scale(0.95);
        }
        
        .step-content {
            background: rgba(255, 248, 240, 0.92);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid #8B4513;
        }
        
        .step-title {
            color: #8B4513;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .step-desc {
            color: #4a3520;
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
        }
        
        .process-bar {
            height: 6px;
            background: rgba(139, 69, 19, 0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .process-progress {
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .stage-lights {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,215,0,0.15) 0%, transparent 60%);
            animation: glow-pulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        
        .draggable-item {
            cursor: grab;
            transition: box-shadow 0.2s ease;
            touch-action: none;
        }
        
        .draggable-item:active {
            cursor: grabbing;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }
        
        .hero-part {
            position: absolute;
            pointer-events: auto;
            z-index: 25;
        }
        
        .hero-head {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .hero-head::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 70%;
            top: 0;
            background: rgba(200, 50, 50, 0.9);
            border-radius: 50% 50% 40% 40%;
        }
        
        .hero-head::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 25%;
            bottom: 5%;
            left: 20%;
            background: rgba(255, 220, 180, 0.9);
            border-radius: 30%;
        }
        
        .hero-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(220, 200, 120, 0.9) 0%, rgba(180, 150, 80, 0.9) 100%);
            border-radius: 15% 15% 10% 10%;
        }
        
        .hero-arm {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(220, 200, 120, 0.9) 0%, rgba(180, 150, 80, 0.9) 100%);
            border-radius: 40%;
        }
        
        .hero-leg {
            width: 100%;
            height: 100%;
            background: rgba(180, 50, 50, 0.9);
            border-radius: 20%;
        }
        
        .weapon-staff {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #B8860B 30%, #FFD700 50%, #B8860B 70%, #FFD700 100%);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .furniture-table {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #8B4513 0%, #654321 100%);
            border-radius: 10px 10px 5px 5px;
            position: relative;
        }
        
        .furniture-table::before {
            content: '';
            position: absolute;
            bottom: -20%;
            left: 15%;
            width: 15%;
            height: 25%;
            background: #4e342e;
        }
        
        .furniture-table::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: 15%;
            width: 15%;
            height: 25%;
            background: #4e342e;
        }
        
        .furniture-chair {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .chair-back {
            position: absolute;
            width: 80%;
            height: 55%;
            top: 0;
            left: 10%;
            background: linear-gradient(180deg, #8B4513 0%, #654321 100%);
            border-radius: 10px 10px 0 0;
        }
        
        .chair-seat {
            position: absolute;
            width: 100%;
            height: 25%;
            top: 50%;
            background: #8B4513;
            border-radius: 5px;
        }
        
        .chair-leg-1 {
            position: absolute;
            width: 15%;
            height: 25%;
            bottom: 0;
            left: 15%;
            background: #654321;
        }
        
        .chair-leg-2 {
            position: absolute;
            width: 15%;
            height: 25%;
            bottom: 0;
            right: 15%;
            background: #654321;
        }
        
        .portrait-photo {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #555 0%, #333 50%, #222 100%);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .portrait-photo::before {
            content: '👤';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            opacity: 0.8;
        }
        
        .portrait-photo::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.3) 100%);
        }
        
        .poster-template {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .poster-1 {
            background: linear-gradient(180deg, #1a1a2e 0%, #2d1f1f 50%, #8B4513 100%);
        }
        
        .poster-2 {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #4a3520 100%);
        }
        
        .poster-3 {
            background: linear-gradient(180deg, #2d1f1f 0%, #3d2914 50%, #5d4037 100%);
        }
        
        .poster-decoration {
            position: absolute;
            color: rgba(255, 215, 0, 0.1);
            font-size: 120px;
        }
        
        .poster-title {
            position: absolute;
            top: 15%;
            left: 0;
            right: 0;
            text-align: center;
            color: #FFD700;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .poster-user {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            text-align: center;
            color: #FFFFFF;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        
        .poster-footer {
            position: absolute;
            bottom: 15%;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        
        .input-field {
            border: 3px solid #8B4513;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            z-index: 40;
        }
        
        .input-field:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .qr-code {
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 8px),
                repeating-linear-gradient(-45deg, #000 0px, #000 4px, #fff 4px, #fff 8px);
            background-size: 8px 8px;
            border: 2px solid #000;
            position: relative;
        }
        
        .qr-code::before {
            content: 'QR';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .hint-text {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
            font-weight: bold;
        }
        
        .slide-up {
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .quote-text {
            font-style: italic;
            border-left: 4px solid #FFD700;
            padding-left: 15px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-text">光影千年...</div>
        </div>
        
        <div class="stage" id="stage"></div>
        
        <div class="page-indicator" id="pageIndicator"></div>
    </div>

    <script>
        const fullConfig = {
            version: "6.0.0",
            name: "光影千年——赣南皮影戏数字体验展",
            width: 375,
            height: 667,
            fps: 24,
            pages: [
                {
                    name: "封面页-光影入梦",
                    duration: 120,
                    layers: [
                        {
                            name: "背景层",
                            type: "shape",
                            x: 0, y: 0, width: 375, height: 667,
                            fill: "#000000"
                        },
                        {
                            name: "油灯层",
                            type: "oil-lamp",
                            x: 40, y: 550, width: 50, height: 75,
                            keyframes: [
                                {frame: 0, opacity: 0},
                                {frame: 30, opacity: 1, ease: "linear"}
                            ]
                        },
                        {
                            name: "光晕层",
                            type: "glow",
                            x: 25, y: 525, width: 80, height: 100
                        },
                        {
                            name: "戏台层",
                            type: "theater",
                            x: 0, y: 0, width: 375, height: 667,
                            keyframes: [
                                {frame: 30, opacity: 0},
                                {frame: 60, opacity: 1, ease: "linear"}
                            ]
                        },
                        {

        class H5Engine {
            constructor(config) {
                this.config = config;
                this.container = document.getElementById('container');
                this.stage = document.getElementById('stage');
                this.indicator = document.getElementById('pageIndicator');
                this.currentPage = 0;
                this.currentFrame = 0;
                this.playing = false;
                this.layers = [];
                this.dragState = null;
                this.posterType = Math.floor(Math.random() * 3) + 1;
                
                this.calculateScale();
                window.addEventListener('resize', () => this.onResize());
                window.addEventListener('orientationchange', () => this.onResize());
            }

            calculateScale() {
                const container = this.container;
                const containerRect = container.getBoundingClientRect();
                this.viewportWidth = containerRect.width;
                this.viewportHeight = containerRect.height;
                
                this.scaleX = this.viewportWidth / 375;
                this.scaleY = this.viewportHeight / 667;
                this.scale = Math.min(this.scaleX, this.scaleY);
                
                const contentWidth = 375 * this.scale;
                const contentHeight = 667 * this.scale;
                this.offsetX = (this.viewportWidth - contentWidth) / 2;
                this.offsetY = (this.viewportHeight - contentHeight) / 2;
            }

            onResize() {
                this.calculateScale();
                this.renderPage(this.currentPage);
            }

            init() {
                this.createPageIndicators();
                this.renderPage(0);
                this.startAnimation();
                
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                }, 1500);
            }

            createPageIndicators() {
                this.indicator.innerHTML = '';
                this.config.pages.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'indicator-dot';
                    if (index === 0) dot.classList.add('active');
                    this.indicator.appendChild(dot);
                });
            }

            updateIndicator(pageIndex) {
                const dots = this.indicator.querySelectorAll('.indicator-dot');
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === pageIndex);
                });
            }

            renderPage(pageIndex) {
                const page = this.config.pages[pageIndex];
                this.stage.innerHTML = '';
                this.layers = [];

                const pageContainer = document.createElement('div');
                pageContainer.className = 'page active fade-in';
                pageContainer.id = `page-${pageIndex}`;

                page.layers.forEach((layer, layerIndex) => {
                    const layerElement = this.createLayerElement(layer, layerIndex);
                    if (layerElement) {
                        pageContainer.appendChild(layerElement);
                        this.layers.push({
                            element: layerElement,
                            config: layer,
                            initialState: this.getLayerInitialState(layer)
                        });
                    }
                });

                this.stage.appendChild(pageContainer);
                this.setupLayerActions(pageIndex);
                this.setupDragElements();
            }

            createLayerElement(layer, index) {
                const element = document.createElement('div');
                element.className = `layer ${layer.type}-layer`;
                element.id = `layer-${index}`;
                element.dataset.layerName = layer.name;
                
                const x = layer.x * this.scale + this.offsetX;
                const y = layer.y * this.scale + this.offsetY;
                const width = layer.width * this.scale;
                const height = layer.height * this.scale;
                
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
                element.style.width = `${width}px`;
                element.style.height = `${height}px`;
                element.style.opacity = '1';

                switch (layer.type) {
                    case 'shape':
                        element.style.background = layer.fill;
                        break;
                    case 'paper':
                        element.classList.add('paper-texture');
                        break;
                    case 'glow':
                        element.classList.add('glow-pulse');
                        element.style.background = 'radial-gradient(circle, rgba(255,165,0,0.6) 0%, rgba(255,200,100,0.3) 50%, transparent 70%)';
                        break;
                    case 'oil-lamp':
                        element.innerHTML = `
                            <div class="oil-lamp-icon oil-lamp">
                                <div class="oil-lamp-body"></div>
                                <div class="oil-lamp-flame"></div>
                            </div>
                        `;
                        break;
                    case 'theater':
                        element.innerHTML = `
                            <div class="theater-bg">
                                <div class="theater-curtain"></div>
                                <div class="theater-stage"></div>
                                <div class="theater-base"></div>
                            </div>
                        `;
                        break;
                    case 'shadow-figure':
                        element.innerHTML = `
                            <div class="shadow-figure-icon">
                                <div class="shadow-head"></div>
                                <div class="shadow-body"></div>
                                <div class="shadow-arm-left"></div>
                                <div class="shadow-arm-right"></div>
                                <div class="shadow-leg-left"></div>
                                <div class="shadow-leg-right"></div>
                            </div>
                        `;
                        break;
                    case 'text':
                        element.classList.add('text-layer');
                        element.style.fontSize = `${layer.fontSize * this.scale}px`;
                        element.style.color = layer.color;
                        element.style.fontWeight = layer.fontWeight || 'normal';
                        element.style.fontStyle = layer.fontStyle || 'normal';
                        element.innerHTML = layer.text;
                        break;
                    case 'button':
                        element.classList.add('button-layer', 'pulse');
                        element.style.background = layer.backgroundColor;
                        element.style.borderRadius = `${layer.borderRadius * this.scale}px`;
                        element.style.color = layer.color;
                        element.style.fontSize = `${layer.fontSize * this.scale}px`;
                        element.innerHTML = layer.text;
                        break;
                    case 'timeline-node':
                        element.classList.add('timeline-node');
                        element.style.background = layer.backgroundColor;
                        element.style.borderRadius = `${layer.borderRadius * this.scale}px`;
                        element.style.cursor = 'pointer';
                        element.innerHTML = `<span class="timeline-label">${layer.label}</span>`;
                        element.dataset.period = layer.label;
                        element.dataset.content = JSON.stringify(layer.content);
                        if (layer.label === '西汉') {
                            element.classList.add('active');
                        }
                        break;
                    case 'content-card':
                        element.classList.add('content-card');
                        const initialContent = this.config.pages[this.currentPage].layers
                            .find(l => l.type === 'timeline-node' && l.label === '西汉')?.content;
                        element.innerHTML = `
                            <div class="content-title" style="font-size:${20 * this.scale}px">${initialContent?.title || '西汉·起源'}</div>
                            <div class="content-text" style="font-size:${13 * this.scale}px">${initialContent?.text || '内容加载中...'}</div>
                        `;
                        break;
                    case 'step-tab':
                        element.classList.add('step-tab');
                        if (layer.isActive) {
                            element.classList.add('active');
                        }
                        element.style.background = layer.backgroundColor;
                        element.style.color = layer.color;
                        element.style.fontSize = `${layer.fontSize * this.scale}px`;
                        element.innerHTML = layer.text;
                        element.dataset.stepIndex = layer.stepIndex;
                        break;
                    case 'step-content':
                        element.classList.add('step-content');
                        const stepData = this.config.stepData[0];
                        element.innerHTML = `
                            <div class="step-title" style="font-size:${22 * this.scale}px">${stepData.title}</div>
                            <div class="step-desc" style="font-size:${14 * this.scale}px;line-height:1.8">${stepData.desc}</div>
                            <div class="process-bar">
                                <div class="process-progress" style="width: ${stepData.progress}%"></div>
                            </div>
                        `;
                        break;
                    case 'wood':
                        element.classList.add('wood-bg');
                        break;
                    case 'stage-lights':
                        element.classList.add('stage-lights');
                        break;
                    case 'draggable':
                        element.classList.add('draggable-item');
                        element.dataset.draggable = 'true';
                        element.innerHTML = this.createDraggableIcon(layer.icon);
                        break;
                    case 'portrait':
                        element.innerHTML = '<div class="portrait-photo"></div>';
                        break;
                    case 'poster':
                        const posterClass = `poster-${this.posterType}`;
                        element.innerHTML = `
                            <div class="poster-template ${posterClass}">
                                <div class="poster-decoration">🎭</div>
                                <div class="poster-title" style="font-size:${28 * this.scale}px">光影千年</div>
                                <div class="poster-user" id="posterUserName" style="font-size:${32 * this.scale}px;opacity:0">_____</div>
                                <div class="poster-footer" style="font-size:${14 * this.scale}px">赣南皮影戏数字体验展</div>
                            </div>
                        `;
                        break;
                    case 'input':
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'input-field';
                        input.placeholder = layer.placeholder;
                        input.style.background = layer.backgroundColor;
                        input.style.color = layer.color;
                        input.style.fontSize = `${layer.fontSize * this.scale}px`;
                        input.style.width = '100%';
                        input.style.height = '100%';
                        input.style.border = 'none';
                        input.style.borderRadius = '12px';
                        input.style.textAlign = 'center';
                        input.style.outline = 'none';
                        element.appendChild(input);
                        break;
                    case 'qr-code':
                        element.innerHTML = '<div class="qr-code"></div>';
                        break;
                    case 'group':
                        if (layer.visible === false) {
                            element.style.display = 'none';
                        }
                        break;
                }

                return element;
            }

            createDraggableIcon(icon) {
                const icons = {
                    'hero-head': '<div class="hero-head"></div>',
                    'hero-body': '<div class="hero-body"></div>',
                    'hero-arm': '<div class="hero-arm"></div>',
                    'hero-leg': '<div class="hero-leg"></div>',
                    'weapon-staff': '<div class="weapon-staff"></div>',
                    'furniture-table': '<div class="furniture-table"></div>',
                    'furniture-chair': `
                        <div class="furniture-chair">
                            <div class="chair-back"></div>
                            <div class="chair-seat"></div>
                            <div class="chair-leg-1"></div>
                            <div class="chair-leg-2"></div>
                        </div>
                    `
                };
                return icons[icon] || '';
            }

            getLayerInitialState(layer) {
                const x = layer.x * this.scale + this.offsetX;
                const y = layer.y * this.scale + this.offsetY;
                const width = layer.width * this.scale;
                const height = layer.height * this.scale;
                
                return { x, y, opacity: 1, scaleX: 1, scaleY: 1, width, height };
            }

            setupLayerActions(pageIndex) {
                this.layers.forEach(({element, config}) => {
                    if (config.actions) {
                        config.actions.forEach(action => {
                            const isTouchEvent = action.event === 'touchstart';
                            element.addEventListener(action.event, (e) => {
                                if (isTouchEvent) {
                                    e.preventDefault();
                                }
                                e.stopPropagation();
                                this.handleAction(action, config);
                            }, { passive: !isTouchEvent });
                        });
                    }
                });

                const stepTabs = this.stage.querySelectorAll('.step-tab');
                stepTabs.forEach(tab => {
                    tab.addEventListener('click', () => this.handleStepClick(tab));
                    tab.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.handleStepClick(tab);
                    });
                });

                const navButtons = {
                    '下一页按钮': pageIndex + 1,
                    '互动表演': 3,
                    '传承故事': 4,
                    '生成海报': 5
                };
                
                this.stage.querySelectorAll('.button-layer').forEach(btn => {
                    const btnName = btn.closest('.layer')?.dataset?.layerName || '';
                    const text = btn.textContent.trim();
                    
                    if (text === '上一页' && pageIndex > 0) {
                        btn.style.cursor = 'pointer';
                        btn.onclick = () => this.gotoPage(pageIndex - 1);
                        btn.ontouchstart = (e) => { e.preventDefault(); this.gotoPage(pageIndex - 1); };
                    } else if (navButtons[text] !== undefined && navButtons[text] < this.config.pages.length) {
                        btn.style.cursor = 'pointer';
                        btn.onclick = () => this.gotoPage(navButtons[text]);
                        btn.ontouchstart = (e) => { e.preventDefault(); this.gotoPage(navButtons[text]); };
                    } else if (btnName === '生成按钮层') {
                        btn.onclick = () => this.handleGeneratePoster();
                        btn.ontouchstart = (e) => { e.preventDefault(); this.handleGeneratePoster(); };
                    }
                });
            }

            handleStepClick(tab) {
                const stepIndex = parseInt(tab.dataset.stepIndex);
                
                this.stage.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const stepData = this.config.stepData[stepIndex];
                const contentArea = this.stage.querySelector('.step-content');
                if (contentArea && stepData) {
                    contentArea.innerHTML = `
                        <div class="step-title slide-up" style="font-size:${22 * this.scale}px">${stepData.title}</div>
                        <div class="step-desc" style="font-size:${14 * this.scale}px;line-height:1.8">${stepData.desc}</div>
                        <div class="process-bar">
                            <div class="process-progress" style="width: ${stepData.progress}%"></div>
                        </div>
                    `;
                }
            }

            setupDragElements() {
                const draggables = this.stage.querySelectorAll('[data-draggable="true"]');
                
                draggables.forEach(element => {
                    let isDragging = false;
                    let startX, startY;
                    let elemStartX, elemStartY;

                    element.addEventListener('mousedown', startDrag);
                    element.addEventListener('touchstart', startDrag, { passive: false });

                    function startDrag(e) {
                        isDragging = true;
                        const point = e.touches ? e.touches[0] : e;
                        startX = point.clientX;
                        startY = point.clientY;
                        elemStartX = element.offsetLeft;
                        elemStartY = element.offsetTop;
                        
                        element.style.zIndex = '100';
                        element.style.transition = 'none';
                        
                        e.preventDefault();
                    }

                    document.addEventListener('mousemove', drag);
                    document.addEventListener('touchmove', drag, { passive: false });

                    function drag(e) {
                        if (!isDragging) return;
                        
                        const point = e.touches ? e.touches[0] : e;
                        const deltaX = point.clientX - startX;
                        const deltaY = point.clientY - startY;
                        
                        element.style.left = `${elemStartX + deltaX}px`;
                        element.style.top = `${elemStartY + deltaY}px`;
                        
                        e.preventDefault();
                    }

                    function endDrag() {
                        if (isDragging) {
                            isDragging = false;
                            element.style.zIndex = '';
                        }
                    }

                    document.addEventListener('mouseup', endDrag);
                    document.addEventListener('touchend', endDrag);
                });
            }

            handleGeneratePoster() {
                const input = this.stage.querySelector('.input-field');
                const userName = input?.value?.trim() || '匿名皮影爱好者';
                
                const userNameEl = this.stage.querySelector('#posterUserName');
                if (userNameEl) {
                    userNameEl.textContent = userName;
                    userNameEl.style.opacity = '1';
                    userNameEl.classList.add('slide-up');
                }
                
                input.parentElement.style.display = 'none';
                
                const generateBtn = this.stage.querySelector('[data-layer-name="生成按钮层"]');
                if (generateBtn) {
                    generateBtn.style.display = 'none';
                }
                
                const shareGroup = this.stage.querySelector('[data-layer-name="保存分享层"]');
                if (shareGroup) {
                    shareGroup.style.display = 'block';
                }
                
                const saveBtn = this.stage.querySelector('[data-layer-name="保存按钮"]');
                const shareBtn = this.stage.querySelector('[data-layer-name="分享按钮"]');
                
                if (saveBtn) {
                    saveBtn.querySelector('.button-layer')?.addEventListener('click', () => {
                        alert('请长按海报图片保存到相册');
                    });
                }
            }

            handleAction(action, config) {
                switch (action.action) {
                    case 'gotoPage':
                        this.gotoPage(action.page);
                        break;
                    case 'showContent':
                        this.showContent(config);
                        break;
                }
            }

            showContent(nodeConfig) {
                const contentCard = this.stage.querySelector('.content-card');
                if (contentCard && nodeConfig.content) {
                    const titleSize = 20 * this.scale;
                    const textSize = 13 * this.scale;
                    contentCard.innerHTML = `
                        <div class="content-title slide-up" style="font-size:${titleSize}px">${nodeConfig.content.title}</div>
                        <div class="content-text" style="font-size:${textSize}px">${nodeConfig.content.text}</div>
                    `;
                }

                const nodes = this.stage.querySelectorAll('.timeline-node');
                nodes.forEach(node => {
                    node.classList.toggle('active', node.dataset.period === nodeConfig.label);
                });
            }

            gotoPage(pageIndex) {
                if (pageIndex < 0 || pageIndex >= this.config.pages.length) return;
                
                this.stopAnimation();
                this.currentPage = pageIndex;
                this.currentFrame = 0;
                this.renderPage(pageIndex);
                this.updateIndicator(pageIndex);
                this.startAnimation();
            }

            startAnimation() {
                this.playing = true;
                this.animate();
            }

            stopAnimation() {
                this.playing = false;
            }

            animate() {
                if (!this.playing) return;

                const page = this.config.pages[this.currentPage];
                
                this.layers.forEach(({element, config, initialState}) => {
                    this.applyKeyframes(element, config, initialState, this.currentFrame);
                });

                const stopAction = page.actions?.find(a => a.action === 'stop');
                if (stopAction && this.currentFrame >= stopAction.frame) {
                    return;
                }

                this.currentFrame++;
                
                if (this.currentFrame <= page.duration + 120) {
                    setTimeout(() => this.animate(), 1000 / this.config.fps);
                }
            }

            applyKeyframes(element, config, initialState, frame) {
                const keyframes = config.keyframes || [];
                if (keyframes.length === 0) return;

                let prevKeyframe = null;
                let nextKeyframe = null;

                for (let i = 0; i < keyframes.length; i++) {
                    if (keyframes[i].frame <= frame) {
                        prevKeyframe = keyframes[i];
                    }
                    if (keyframes[i].frame > frame && !nextKeyframe) {
                        nextKeyframe = keyframes[i];
                    }
                }

                if (!prevKeyframe && !nextKeyframe) {
                    element.style.opacity = '0';
                    return;
                }

                if (!prevKeyframe && nextKeyframe && frame < nextKeyframe.frame) {
                    element.style.opacity = nextKeyframe.opacity !== undefined ? '0' : '1';
                    return;
                }

                if (prevKeyframe && !nextKeyframe) {
                    this.applyState(element, prevKeyframe, initialState);
                    return;
                }

                if (prevKeyframe && nextKeyframe) {
                    const progress = (frame - prevKeyframe.frame) / (nextKeyframe.frame - prevKeyframe.frame);
                    const easedProgress = this.ease(progress, prevKeyframe.ease || 'linear');
                    this.interpolateState(element, prevKeyframe, nextKeyframe, easedProgress, initialState);
                }
            }

            applyState(element, keyframe, initialState) {
                if (keyframe.opacity !== undefined) {
                    element.style.opacity = keyframe.opacity;
                }
                if (keyframe.x !== undefined) {
                    element.style.left = `${keyframe.x * this.scale + this.offsetX}px`;
                }
                if (keyframe.y !== undefined) {
                    element.style.top = `${keyframe.y * this.scale + this.offsetY}px`;
                }
                if (keyframe.width !== undefined) {
                    element.style.width = `${keyframe.width * this.scale}px`;
                }
                if (keyframe.height !== undefined) {
                    element.style.height = `${keyframe.height * this.scale}px`;
                }
                if (keyframe.scale !== undefined || keyframe.scaleX !== undefined || keyframe.scaleY !== undefined) {
                    const scaleX = keyframe.scaleX !== undefined ? keyframe.scaleX : (keyframe.scale || 1);
                    const scaleY = keyframe.scaleY !== undefined ? keyframe.scaleY : (keyframe.scale || 1);
                    element.style.transform = `scale(${scaleX}, ${scaleY})`;
                }
            }

            interpolateState(element, prev, next, progress, initialState) {
                if (prev.opacity !== undefined || next.opacity !== undefined) {
                    const startOpacity = prev.opacity !== undefined ? prev.opacity : 1;
                    const endOpacity = next.opacity !== undefined ? next.opacity : startOpacity;
                    element.style.opacity = startOpacity + (endOpacity - startOpacity) * progress;
                }

                if (prev.x !== undefined || next.x !== undefined) {
                    const startX = prev.x !== undefined ? prev.x * this.scale + this.offsetX : parseFloat(element.style.left) || initialState.x;
                    const endX = next.x !== undefined ? next.x * this.scale + this.offsetX : startX;
                    element.style.left = `${startX + (endX - startX) * progress}px`;
                }

                if (prev.y !== undefined || next.y !== undefined) {
                    const startY = prev.y !== undefined ? prev.y * this.scale + this.offsetY : parseFloat(element.style.top) || initialState.y;
                    const endY = next.y !== undefined ? next.y * this.scale + this.offsetY : startY;
                    element.style.top = `${startY + (endY - startY) * progress}px`;
                }

                if (prev.scale !== undefined || next.scale !== undefined || 
                    prev.scaleX !== undefined || next.scaleX !== undefined ||
                    prev.scaleY !== undefined || next.scaleY !== undefined) {
                    const startScaleX = prev.scaleX !== undefined ? prev.scaleX : (prev.scale || 1);
                    const endScaleX = next.scaleX !== undefined ? next.scaleX : (next.scale || startScaleX);
                    const startScaleY = prev.scaleY !== undefined ? prev.scaleY : (prev.scale || 1);
                    const endScaleY = next.scaleY !== undefined ? next.scaleY : (next.scale || startScaleY);
                    
                    const scaleX = startScaleX + (endScaleX - startScaleX) * progress;
                    const scaleY = startScaleY + (endScaleY - startScaleY) * progress;
                    
                    element.style.transform = `scale(${scaleX}, ${scaleY})`;
                }
            }

            ease(progress, type) {
                switch (type) {
                    case 'easeIn':
                        return progress * progress;
                    case 'easeOut':
                        return 1 - (1 - progress) * (1 - progress);
                    case 'easeInOut':
                        return progress < 0.5 
                            ? 2 * progress * progress 
                            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    case 'linear':
                    default:
                        return progress;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const engine = new H5Engine(fullConfig);
            engine.init();
        });

        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.content-card') || 
                e.target.closest('.input-field') || 
                e.target.closest('[data-draggable="true"]')) return;
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
